<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--green:#173a2e;--green2:#0f2a21;--gold:#b8923f;--gold2:#e2c778;--ivory:#fbf6ea;--ink:#3a2d22;--rose:#c98b8b}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink);background:var(--green2);font-size:20px;line-height:1.6;overflow-x:hidden}
.script{font-family:"Great Vibes","Snell Roundhand",cursive;font-weight:400}

/* ---------- Envelope intro ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--green),var(--green2));transition:opacity 1s .9s,visibility 0s 1.9s}
#intro.open{opacity:0;visibility:hidden}
.env{position:relative;width:min(84vw,420px);aspect-ratio:1.5;cursor:pointer;filter:drop-shadow(0 20px 30px #0008);animation:float 3.5s ease-in-out infinite}
#intro.open .env{animation:none}
.env .body{position:absolute;inset:0;background:var(--ivory);border-radius:4px}
.env .body::before,.env .body::after{content:"";position:absolute;bottom:0;width:50%;height:100%;background:#efe6d0}
.env .body::before{left:0;clip-path:polygon(0 0,100% 100%,0 100%)}
.env .body::after{right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;top:0;left:0;width:100%;height:58%;background:#e8dcc0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease;z-index:3}
#intro.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:4;display:grid;place-items:center;color:var(--gold2);font-size:28px;background:radial-gradient(circle at 35% 30%,#d9a2a2,var(--rose) 55%,#9c5f5f);box-shadow:0 3px 8px #0006;transition:opacity .3s}
#intro.open .seal{opacity:0}
.hint{position:absolute;bottom:14%;width:100%;text-align:center;color:var(--gold2);letter-spacing:.2em;font-style:italic;animation:pulse 2s infinite}
#intro.open .hint{display:none}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Invitation ---------- */
main{position:relative;z-index:1;padding:6vh 16px 10vh;display:flex;justify-content:center}
.card{width:min(94vw,640px);background:var(--ivory);padding:12px;box-shadow:0 30px 60px #0009;opacity:0;transform:translateY(40px) scale(.97);transition:opacity 1.2s 1.2s,transform 1.2s 1.2s}
body.opened .card{opacity:1;transform:none}
.frame{border:2px solid var(--gold);padding:8px}
.inner{position:relative;overflow:hidden;border:1px solid var(--gold);padding:44px 26px;text-align:center;background:
 radial-gradient(circle at 0 0,#e2c77855,transparent 130px),radial-gradient(circle at 100% 100%,#e2c77855,transparent 130px),var(--ivory)}
.blessing{font-style:italic;color:var(--gold);letter-spacing:.06em}
.lead{margin-top:26px;letter-spacing:.14em;font-size:.85em}
.names{font-size:clamp(46px,13vw,76px);line-height:1.1;color:var(--green);margin:8px 0}
.names .amp{display:block;font-size:.5em;color:var(--gold);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:22px auto;max-width:320px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{transform:scaleX(-1)}
h2{font-weight:600;font-size:1.05em;letter-spacing:.2em;color:var(--green);margin-bottom:4px}
.date{font-size:clamp(24px,6vw,34px);color:var(--green)}
.sub{font-style:italic}
.section{margin:34px 0}
/* scroll reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}
/* countdown */
.cd{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cd div{width:74px;padding:10px 0;border:1px solid var(--gold);background:#fffdf6}
.cd b{display:block;font-size:30px;color:var(--green);font-weight:600;line-height:1.1}
.cd span{font-size:.7em;letter-spacing:.14em;color:var(--gold)}
/* buttons */
.btns{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-block;padding:11px 26px;border:1px solid var(--green);color:var(--green);text-decoration:none;letter-spacing:.12em;font-size:.85em;position:relative;overflow:hidden;transition:color .35s;z-index:0}
.btn::before{content:"";position:absolute;inset:0;background:var(--green);transform:translateY(101%);transition:transform .35s;z-index:-1}
.btn:hover,.btn:focus-visible{color:var(--gold2)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn.solid{background:var(--green);color:var(--gold2)}
.btn.solid::before{background:var(--gold)}
.btn.solid:hover{color:var(--green2)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border:1px solid var(--gold);border-radius:999px;color:var(--green);text-decoration:none;font-size:.78em;letter-spacing:.06em;background:#fffdf6;transition:background .3s,color .3s,transform .3s}
.chip:hover,.chip:focus-visible{background:var(--green);color:var(--gold2);transform:translateY(-2px)}
.foot{margin-top:38px;color:var(--gold)}
/* hide & seek */
.hs{margin-top:14px;font-size:.8em;font-style:italic;color:var(--gold);min-height:1.6em;transition:color .4s}
.hs.win{color:var(--green);font-weight:600}
.hider{position:absolute;z-index:5;font-size:38px;line-height:1;cursor:pointer;background:none;border:0;padding:6px;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.hider.L{left:0;transform:translateX(-90%)}.hider.L.peek{transform:translateX(-22%) rotate(12deg)}
.hider.R{right:0;transform:translateX(90%)}.hider.R.peek{transform:translateX(22%) rotate(-12deg)}
.hider.gone{opacity:0;pointer-events:none}
.heart{position:absolute;z-index:6;font-size:20px;pointer-events:none;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--hx),-120px) scale(1.4);opacity:0}}
.foot .script{font-size:2em;color:var(--green)}

/* music */
#music{position:fixed;right:16px;bottom:16px;z-index:60;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:var(--green);color:var(--gold2);font-size:20px;cursor:pointer;display:none;place-items:center}
body.opened #music{display:grid}
#music.on{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fall{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.p{position:absolute;top:-30px;width:12px;height:16px;border-radius:80% 0 80% 0;background:var(--rose);opacity:.75;animation:drop linear infinite}
.p.g{background:var(--gold2)}
@keyframes drop{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>

<!-- Envelope -->
<div id="intro">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="body"></div>
    <div class="flap"></div>
    <div class="seal script">&amp;</div>
  </div>
  <div class="hint">TAP TO OPEN</div>
</div>

<div id="fall" aria-hidden="true"></div>

<main>
  <article class="card">
   <div class="frame"><div class="inner">

    <p class="blessing" data-k="blessing"></p>
    <p class="lead" data-k="lead"></p>
    <h1 class="names script"><span data-k="bride"></span><span class="amp">&amp;</span><span data-k="groom"></span></h1>
    <p class="sub" data-k="tagline"></p>
    <p class="hs" id="hs">Psst… the couple is playing hide &amp; seek on this card. Can you find them?</p>
    <div class="orn">❦</div>

    <div class="section rv">
      <p class="sub" data-k="weddingLine"></p>
      <div class="orn">✦</div>
      <h2>WEDDING RECEPTION</h2>
      <p class="date" data-k="date"></p>
      <p data-k="time"></p>
    </div>

    <div class="section rv">
      <h2>THE VENUE</h2>
      <p class="date" data-k="venue"></p>
      <p class="sub" data-k="address"></p>
      <div class="btns"><a class="btn solid" id="mapLink" target="_blank" rel="noopener">VIEW LOCATION</a></div>
    </div>

    <div class="section rv">
      <h2>COUNTING THE DAYS</h2>
      <div class="cd" id="cd"></div>
    </div>

    <div class="section rv">
      <h2>WITH LOVE, THE FAMILIES OF</h2>
      <p data-k="families"></p>
    </div>

    <div class="section rv">
      <h2>KINDLY RSVP</h2>
      <p class="sub" data-k="rsvp"></p>
      <div class="btns">
        <a class="chip" id="callLink" aria-label="Call">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Call</a>
        <a class="chip" id="waLink" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8L4 20z"/></svg>WhatsApp</a>
      </div>
    </div>

    <div class="orn">❦</div>
    <p class="foot"><span class="script" data-k="closing"></span></p>
   </div></div>
  </article>
</main>

<button id="music" aria-label="Toggle music" title="Music on/off">♪</button>

<script>
/* ================== EDIT YOUR DETAILS HERE ================== */
const D = {
  blessing: "With the blessings of God",
  lead:     "TOGETHER WITH THEIR FAMILIES",
  bride:    "Bride Name",
  groom:    "Groom Name",
  tagline:  "request the pleasure of your company at their wedding reception",
  weddingLine: "Our wedding will be solemnized on Saturday, 14 February 2027",  // wedding date (info only)
  date:     "Sunday, 15 February 2027",   // reception date
  time:     "Reception from 7:00 PM onwards",
  venue:    "Venue Name",
  address:  "Street, City, State, PIN",
  families: "Bride's Parents  &  Groom's Parents",
  rsvp:     "We would be delighted to have you with us. Please confirm your presence.",
  closing:  "See you there!",

  weddingDateTime: "2027-02-15T19:00:00",         // countdown target = reception start (local time)
  mapUrl:   "https://maps.google.com/?q=Your+Venue+Name",  // paste Google Maps share link
  phone:    "+910000000000",                      // with country code, no spaces
  whatsapp: "910000000000",                       // country code + number, no + sign

  musicFile: ""   // optional: e.g. "song.mp3" placed next to this file. Empty = built-in soft melody
};
/* ============================================================ */

document.querySelectorAll("[data-k]").forEach(e=>e.textContent=D[e.dataset.k]);
mapLink.href=D.mapUrl; callLink.href="tel:"+D.phone;
waLink.href="https://wa.me/"+D.whatsapp+"?text="+encodeURIComponent("Hi! Thank you for the invitation.");

/* Countdown */
const cd=document.getElementById("cd");
function tick(){
  let s=Math.max(0,(new Date(D.weddingDateTime)-new Date())/1000|0);
  const v=[[s/86400|0,"DAYS"],[s%86400/3600|0,"HOURS"],[s%3600/60|0,"MINS"],[s%60,"SECS"]];
  cd.innerHTML=v.map(([n,l])=>`<div><b>${String(n).padStart(2,"0")}</b><span>${l}</span></div>`).join("");
}
tick(); setInterval(tick,1000);

/* Scroll reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.2});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));

/* Falling petals */
function petals(){
  const f=document.getElementById("fall");
  for(let i=0;i<22;i++){
    const p=document.createElement("i");p.className="p"+(i%3?"":" g");
    p.style.left=Math.random()*100+"%";
    p.style.setProperty("--dx",(Math.random()*160-80)+"px");
    p.style.animationDuration=(9+Math.random()*9)+"s";
    p.style.animationDelay=(Math.random()*8)+"s";
    f.appendChild(p);
  }
}

/* Music: file if provided, otherwise a soft generated melody */
let audio=null,ctx=null,timer=null,playing=false;
const notes=[392,494,587,784,659,587,494,440,392,494,587,659,587,494,392,330]; // gentle G-major phrase
function chime(freq,t){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type="sine";o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+1.7);
}
function startMusic(){
  if(D.musicFile){audio=audio||Object.assign(new Audio(D.musicFile),{loop:true,volume:.5});audio.play().catch(()=>{});}
  else{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
    let i=0;const step=()=>{chime(notes[i++%notes.length],ctx.currentTime);};
    step();timer=setInterval(step,700);
  }
  playing=true;music.classList.add("on");
}
function stopMusic(){
  if(audio)audio.pause();
  clearInterval(timer);if(ctx)ctx.suspend();
  playing=false;music.classList.remove("on");
}
music.onclick=()=>playing?stopMusic():startMusic();

/* Hide & seek: bride and groom peek from the card edges, then move */
const inner=document.querySelector(".inner");
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const h=document.createElement("span");h.className="heart";h.textContent=i%2?"💗":"💛";
    h.style.left=x+"px";h.style.top=y+"px";h.style.setProperty("--hx",(Math.random()*120-60)+"px");
    inner.appendChild(h);setTimeout(()=>h.remove(),1500);
  }
}
function startGame(){
  let found=0;
  const players=[["👰","the bride"],["🤵","the groom"]].map(([ico,who],i)=>{
    const el=document.createElement("button");
    el.className="hider";el.textContent=ico;el.setAttribute("aria-label","Find "+who);
    inner.appendChild(el);
    const p={el,done:false};
    p.move=()=>{
      if(p.done)return;
      el.classList.remove("peek");
      setTimeout(()=>{
        if(p.done)return;
        el.classList.remove("L","R");
        el.classList.add(Math.random()<.5?"L":"R");
        el.style.top=(12+Math.random()*72)+"%";
        setTimeout(()=>el.classList.add("peek"),80);
      },800);
    };
    el.onclick=e=>{
      p.done=true;found++;el.classList.add("gone");
      const r=inner.getBoundingClientRect();
      burst(e.clientX-r.left,e.clientY-r.top,8);
      if(found===1)hs.textContent="Found "+who+"! Now, where is the other one? 👀";
      else{
        hs.textContent="You found us! See you at the reception 💕";hs.classList.add("win");
        for(let k=0;k<5;k++)setTimeout(()=>burst(Math.random()*r.width,r.height*(.3+Math.random()*.5),6),k*250);
      }
    };
    setTimeout(p.move,i*1500);
    setInterval(p.move,5000);
    return p;
  });
}

/* Open envelope */
function openEnv(){
  if(intro.classList.contains("open"))return;
  intro.classList.add("open");
  setTimeout(()=>{document.body.classList.add("opened");petals();setTimeout(startGame,1800);},700);
  startMusic();
}
env.onclick=openEnv;
env.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEnv()}};
</script>
</body>
</html>
